name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты (JDK 17, build-tools 34, apktool)
        shell: pwsh
        run: ./tools/setup-toolchain.ps1

      - name: Сборка APK
        shell: pwsh
        run: ./build.ps1

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: okei-schedule-apk
          path: dist/*.apk
          if-no-files-found: error
